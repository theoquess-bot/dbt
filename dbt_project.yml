name: freelance_market
version: '1.0.0'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

vars:
  # Début / fin du calendrier de dim_date
  date_debut: '2026-09-01'
  date_fin: '2027-12-31'

models:
  freelance_market:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view        # passer en ephemeral quand tout est stabilisé
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  freelance_market:
    +schema: ref
    ref_type_travail:
      +column_types: {work_mode_brut: varchar, libelle: varchar, ordre: number}
    ref_seniorite:
      +column_types: {libelle: varchar, ordre: number, annees_min: number, annees_max: number}
    ref_ville_region:
      +column_types: {ville_norm: varchar, ville: varchar, region: varchar, pays: varchar}
    ref_metier:
      +column_types: {priorite: number, pattern: varchar, metier: varchar, famille: varchar}
    ref_stack:
      +column_types: {pattern: varchar, stack: varchar, famille: varchar}